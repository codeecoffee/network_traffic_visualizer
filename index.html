<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Traffic Visualizer</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --surface3: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #388bfd;
    --accent2: #56d364;
    --danger: #f85149;
    --warn: #e3b341;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

  /* ── TOP NAV ── */
  #topnav {
    display: flex; align-items: center; gap: 0; background: var(--surface); border-bottom: 1px solid var(--border);
    height: 46px; padding: 0 16px; flex-shrink: 0; z-index: 200;
  }
  #topnav .logo { font-weight: 700; font-size: 15px; color: var(--accent); margin-right: 24px; letter-spacing: .5px; }
  .tab-btn {
    padding: 0 16px; height: 46px; background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--text-muted); cursor: pointer; font-size: 13px; transition: color .15s, border-color .15s;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-btn:hover { color: var(--text); }
  #topnav .spacer { flex: 1; }
  .icon-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted); cursor: pointer;
    padding: 5px 10px; border-radius: var(--radius); font-size: 12px; transition: all .15s;
  }
  .icon-btn:hover { background: var(--surface3); color: var(--text); }

  /* ── MAIN LAYOUT ── */
  #app { display: flex; flex: 1; overflow: hidden; }
  .panel { flex-shrink: 0; overflow: hidden; display: flex; flex-direction: column; }
  .panel-header {
    padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── CANVAS / TOPOLOGY ── */
  #canvas-wrap { flex: 1; position: relative; overflow: hidden; }
  #topology-canvas { position: absolute; inset: 0; }
  #particle-canvas { position: absolute; inset: 0; pointer-events: none; }

  /* ── LEFT PANEL – VLANS ── */
  #panel-vlans { width: 220px; border-right: 1px solid var(--border); background: var(--surface); }

  .vlan-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius);
    cursor: pointer; transition: background .15s; margin-bottom: 3px;
  }
  .vlan-item:hover { background: var(--surface3); }
  .vlan-item.selected { background: var(--surface3); outline: 1px solid var(--accent); }
  .vlan-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .vlan-name { font-weight: 500; flex: 1; }
  .vlan-badge { background: var(--surface3); border-radius: 4px; padding: 1px 5px; font-size: 10px; color: var(--text-muted); }

  .section-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .6px; margin: 10px 0 4px; padding: 0 2px; }

  /* ── RIGHT PANEL – RULES ── */
  #panel-rules { width: 340px; border-left: 1px solid var(--border); background: var(--surface); }

  .rule-item {
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 6px; padding: 9px 10px; cursor: grab; position: relative; transition: background .15s;
  }
  .rule-item:active { cursor: grabbing; }
  .rule-item.dragging { opacity: .4; }
  .rule-item.drag-over { border-color: var(--accent); }
  .rule-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .rule-action {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; text-transform: uppercase;
  }
  .rule-action.block { background: rgba(248,81,73,.18); color: var(--danger); }
  .rule-action.allow { background: rgba(86,211,100,.18); color: var(--accent2); }
  .rule-action.reject { background: rgba(227,179,65,.18); color: var(--warn); }
  .rule-name { font-weight: 600; flex: 1; font-size: 12px; }
  .rule-detail { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
  .rule-btns { display: flex; gap: 4px; }
  .rule-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 2px 5px; border-radius: 4px; font-size: 11px; }
  .rule-btn:hover { background: var(--surface3); color: var(--text); }
  .rule-handle { color: var(--border); font-size: 14px; cursor: grab; }
  .rule-enabled { width: 24px; height: 14px; border-radius: 7px; border: none; cursor: pointer; flex-shrink: 0; position: relative; transition: background .2s; }
  .rule-enabled.on { background: var(--accent2); }
  .rule-enabled.off { background: var(--border); }

  /* ── ADD RULE MODAL / FORM ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 500; display: flex;
    align-items: center; justify-content: center;
  }
  .modal {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; width: 420px;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal-header {
    padding: 16px 18px 12px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-body { padding: 16px 18px; }
  .modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
  .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; line-height: 1; }
  .close-btn:hover { color: var(--text); }

  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
  .form-input, .form-select {
    width: 100%; background: var(--surface3); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius); padding: 7px 10px; font-size: 13px; outline: none;
  }
  .form-input:focus, .form-select:focus { border-color: var(--accent); }
  .form-select option { background: var(--surface3); }

  .radio-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .radio-opt {
    display: flex; align-items: center; gap: 5px; padding: 5px 10px;
    background: var(--surface3); border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
    font-size: 12px; transition: all .15s;
  }
  .radio-opt input { accent-color: var(--accent); }
  .radio-opt:has(input:checked) { border-color: var(--accent); background: rgba(56,139,253,.1); }

  .btn {
    padding: 7px 16px; border-radius: var(--radius); border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #58a6ff; }
  .btn-secondary { background: var(--surface3); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--surface2); }
  .btn-danger { background: rgba(248,81,73,.15); color: var(--danger); border: 1px solid rgba(248,81,73,.3); }
  .btn-danger:hover { background: rgba(248,81,73,.25); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  /* ── SWITCH PANEL (tab) ── */
  #view-switch { display: none; flex: 1; flex-direction: row; gap: 16px; padding: 16px; overflow: auto; }
  #view-switch.active { display: flex; }

  .switch-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
    min-width: 340px;
  }
  .switch-card h3 { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
  .ports-grid { display: grid; grid-template-columns: repeat(12,1fr); gap: 4px; margin-bottom: 10px; }
  .port {
    aspect-ratio: 1; border-radius: 4px; border: 1px solid var(--border); background: var(--surface2);
    display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
    transition: all .15s; font-size: 9px; color: var(--text-muted);
  }
  .port:hover { border-color: var(--accent); }
  .port.active { background: var(--surface3); }
  .port.blocked { background: rgba(248,81,73,.15); border-color: var(--danger); }
  .port.trunk { border-color: var(--warn); }
  .port-activity { position: absolute; bottom: 2px; right: 2px; width: 4px; height: 4px; border-radius: 50%; }

  /* ── TOOLTIP ── */
  #tooltip {
    position: fixed; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 13px; font-size: 12px; pointer-events: none; z-index: 999; max-width: 240px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); display: none; line-height: 1.6;
  }
  #tooltip.visible { display: block; }
  #tooltip .tt-title { font-weight: 700; margin-bottom: 4px; font-size: 13px; }
  #tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; }
  #tooltip .tt-key { color: var(--text-muted); }
  #tooltip .tt-val { font-weight: 600; }

  /* ── DEVICES PANEL ── */
  .device-chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px;
    background: var(--surface3); border: 1px solid var(--border); border-radius: 20px;
    font-size: 11px; cursor: pointer; transition: all .15s; margin: 2px;
  }
  .device-chip:hover { border-color: var(--accent); }
  .device-chip.selected { border-color: var(--accent); background: rgba(56,139,253,.1); }

  /* ── DRAG placeholder ── */
  .drag-placeholder { border: 2px dashed var(--accent); border-radius: var(--radius); height: 42px; margin-bottom: 6px; }

  /* ── EXPORT badge ── */
  .export-badge { background: var(--accent2); color: #000; font-size: 10px; padding: 1px 5px; border-radius: 4px; font-weight: 700; }

  /* ── topology tab ── */
  #view-topology { display: flex; flex: 1; overflow: hidden; }
  #view-topology.hidden, #view-switch.hidden { display: none !important; }
</style>
</head>
<body>

<!-- TOP NAV -->
<nav id="topnav">
  <span class="logo">⚡ NetViz</span>
  <button class="tab-btn active" onclick="switchTab('topology')">Topology</button>
  <button class="tab-btn" onclick="switchTab('switch')">Switch Ports</button>
  <span class="spacer"></span>
  <button class="icon-btn" onclick="exportRules()" style="margin-right:8px">⬇ Export Rules</button>
  <button class="icon-btn" onclick="openAddRule()">＋ Add Rule</button>
</nav>

<!-- APP BODY -->
<div id="app">

  <!-- ══ TOPOLOGY VIEW ══ -->
  <div id="view-topology">

    <!-- LEFT: VLANs + Devices -->
    <div class="panel" id="panel-vlans">
      <div class="panel-header">
        <span>Networks</span>
        <button class="icon-btn btn-sm" onclick="openAddVlan()">＋</button>
      </div>
      <div class="panel-body" id="vlan-list">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- CENTER: Canvas -->
    <div id="canvas-wrap">
      <canvas id="topology-canvas"></canvas>
      <canvas id="particle-canvas"></canvas>
    </div>

    <!-- RIGHT: Firewall Rules -->
    <div class="panel" id="panel-rules">
      <div class="panel-header">
        <span>Firewall Rules</span>
        <span id="rule-count" class="export-badge">0</span>
      </div>
      <div class="panel-body" id="rules-list">
        <!-- populated by JS -->
      </div>
    </div>

  </div>

  <!-- ══ SWITCH VIEW ══ -->
  <div id="view-switch"></div>

</div>

<!-- ── TOOLTIP ── -->
<div id="tooltip"></div>

<!-- ── ADD RULE MODAL ── -->
<div id="modal-rule" class="modal-overlay" style="display:none" onclick="closeModalIf(event,'modal-rule')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span id="modal-rule-title">Create Policy</span>
      <button class="close-btn" onclick="closeModal('modal-rule')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Name</label>
        <input class="form-input" id="r-name" placeholder="Rule name">
      </div>
      <div class="form-group">
        <label class="form-label">Action</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="r-action" value="block" checked> Block</label>
          <label class="radio-opt"><input type="radio" name="r-action" value="allow"> Allow</label>
          <label class="radio-opt"><input type="radio" name="r-action" value="reject"> Reject</label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Source Zone</label>
        <select class="form-select" id="r-src-zone"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Source Type</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="r-src-type" value="Any" checked> Any</label>
          <label class="radio-opt"><input type="radio" name="r-src-type" value="Device"> Device</label>
          <label class="radio-opt"><input type="radio" name="r-src-type" value="Network"> Network</label>
          <label class="radio-opt"><input type="radio" name="r-src-type" value="IP"> IP</label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Source Port</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="r-src-port" value="Any" checked> Any</label>
          <label class="radio-opt"><input type="radio" name="r-src-port" value="Specific"> Specific</label>
          <label class="radio-opt"><input type="radio" name="r-src-port" value="List"> List</label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Destination Zone</label>
        <select class="form-select" id="r-dst-zone"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Destination Type</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="r-dst-type" value="Any" checked> Any</label>
          <label class="radio-opt"><input type="radio" name="r-dst-type" value="App"> App</label>
          <label class="radio-opt"><input type="radio" name="r-dst-type" value="IP"> IP</label>
          <label class="radio-opt"><input type="radio" name="r-dst-type" value="Domain"> Domain</label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Destination Port</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="r-dst-port" value="Any" checked> Any</label>
          <label class="radio-opt"><input type="radio" name="r-dst-port" value="Specific"> Specific</label>
          <label class="radio-opt"><input type="radio" name="r-dst-port" value="List"> List</label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Protocol</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="r-proto" value="All" checked> All</label>
          <label class="radio-opt"><input type="radio" name="r-proto" value="TCP/UDP"> TCP/UDP</label>
          <label class="radio-opt"><input type="radio" name="r-proto" value="TCP"> TCP</label>
          <label class="radio-opt"><input type="radio" name="r-proto" value="UDP"> UDP</label>
          <label class="radio-opt"><input type="radio" name="r-proto" value="ICMP"> ICMP</label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">IP Version</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="r-ipver" value="Both" checked> Both</label>
          <label class="radio-opt"><input type="radio" name="r-ipver" value="IPv4"> IPv4</label>
          <label class="radio-opt"><input type="radio" name="r-ipver" value="IPv6"> IPv6</label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Schedule</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="r-sched" value="Always" checked> Always</label>
          <label class="radio-opt"><input type="radio" name="r-sched" value="Daily"> Daily</label>
          <label class="radio-opt"><input type="radio" name="r-sched" value="Weekly"> Weekly</label>
          <label class="radio-opt"><input type="radio" name="r-sched" value="One Time"> One Time</label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <input class="form-input" id="r-desc" placeholder="Optional description">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-rule')">Cancel</button>
      <button class="btn btn-primary" onclick="saveRule()">Save Policy</button>
    </div>
  </div>
</div>

<!-- ── ADD VLAN MODAL ── -->
<div id="modal-vlan" class="modal-overlay" style="display:none" onclick="closeModalIf(event,'modal-vlan')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>Add Network / VLAN</span>
      <button class="close-btn" onclick="closeModal('modal-vlan')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Name</label>
        <input class="form-input" id="v-name" placeholder="e.g. IoT">
      </div>
      <div class="form-group">
        <label class="form-label">VLAN ID</label>
        <input class="form-input" id="v-id" type="number" placeholder="e.g. 20">
      </div>
      <div class="form-group">
        <label class="form-label">Subnet</label>
        <input class="form-input" id="v-subnet" placeholder="e.g. 192.168.20.0/24">
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="v-type" value="LAN" checked> LAN</label>
          <label class="radio-opt"><input type="radio" name="v-type" value="WAN"> WAN</label>
          <label class="radio-opt"><input type="radio" name="v-type" value="DMZ"> DMZ</label>
          <label class="radio-opt"><input type="radio" name="v-type" value="Guest"> Guest</label>
          <label class="radio-opt"><input type="radio" name="v-type" value="IoT"> IoT</label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Color</label>
        <input type="color" id="v-color" value="#388bfd" style="width:48px;height:34px;border:none;background:none;cursor:pointer;">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-vlan')">Cancel</button>
      <button class="btn btn-primary" onclick="saveVlan()">Add Network</button>
    </div>
  </div>
</div>

<!-- ── PORT CONFIG MODAL ── -->
<div id="modal-port" class="modal-overlay" style="display:none" onclick="closeModalIf(event,'modal-port')">
  <div class="modal" onclick="event.stopPropagation()" style="width:360px">
    <div class="modal-header">
      <span id="modal-port-title">Port Configuration</span>
      <button class="close-btn" onclick="closeModal('modal-port')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Mode</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="p-mode" value="access" checked> Access</label>
          <label class="radio-opt"><input type="radio" name="p-mode" value="trunk"> Trunk</label>
          <label class="radio-opt"><input type="radio" name="p-mode" value="blocked"> Blocked</label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">VLAN Assignment</label>
        <select class="form-select" id="p-vlan"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Speed</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="p-speed" value="1G" checked> 1G</label>
          <label class="radio-opt"><input type="radio" name="p-speed" value="10G"> 10G</label>
          <label class="radio-opt"><input type="radio" name="p-speed" value="100M"> 100M</label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-port')">Cancel</button>
      <button class="btn btn-primary" onclick="savePort()">Apply</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
const VLAN_COLORS = ['#388bfd','#56d364','#f85149','#e3b341','#bc8cff','#39d0d8','#ff7b72','#ffa657','#79c0ff','#7ee787'];

let vlans = [
  { id: 1,   name: 'Management',  subnet: '10.0.1.0/24',   type: 'LAN',   color: '#388bfd' },
  { id: 10,  name: 'Trusted LAN', subnet: '192.168.10.0/24', type: 'LAN', color: '#56d364' },
  { id: 20,  name: 'IoT',         subnet: '192.168.20.0/24', type: 'IoT', color: '#e3b341' },
  { id: 30,  name: 'Guest',       subnet: '192.168.30.0/24', type: 'Guest',color: '#bc8cff' },
  { id: 40,  name: 'DMZ',         subnet: '10.0.40.0/24',   type: 'DMZ',  color: '#ff7b72' },
  { id: 0,   name: 'WAN',         subnet: '203.0.113.0/24', type: 'WAN',  color: '#8b949e' },
];

let rules = [];
let switches = [
  { id: 'sw1', name: 'Core Switch (24-port)', portCount: 24, ports: [] },
  { id: 'sw2', name: 'Access Switch (8-port)', portCount: 8, ports: [] },
];

// Init ports
switches.forEach(sw => {
  for (let i = 0; i < sw.portCount; i++) {
    sw.ports.push({
      num: i + 1,
      mode: 'access',
      vlan: vlans[1].id,
      speed: '1G',
      blocked: false,
      active: Math.random() > 0.3,
      traffic: Math.random() * 800,
    });
  }
});

// Topology nodes
let topoNodes = [];
let editingRuleId = null;

const topCvs = document.getElementById('topology-canvas');
const topCtx = topCvs.getContext('2d');
const partCvs = document.getElementById('particle-canvas');
const partCtx = partCvs.getContext('2d');

let particles = [];
let animFrame;
let hoveredNode = null;
let hoveredParticle = null;

function resizeCanvases() {
  const wrap = document.getElementById('canvas-wrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  topCvs.width = partCvs.width = w;
  topCvs.height = partCvs.height = h;
  layoutNodes();
  drawTopology();
}

function getVlanColor(vlanId) {
  const v = vlans.find(x => x.id === vlanId);
  return v ? v.color : '#8b949e';
}

function layoutNodes() {
  const w = topCvs.width, h = topCvs.height;
  const cx = w / 2, cy = h / 2;

  // Place router at center-top, switch below it
  devices.find(d => d.id === 'd1').x = cx;
  devices.find(d => d.id === 'd1').y = cy * 0.28;
  devices.find(d => d.id === 'd2').x = cx;
  devices.find(d => d.id === 'd2').y = cy * 0.55;
  devices.find(d => d.id === 'd11').x = cx;
  devices.find(d => d.id === 'd11').y = cy * 0.08;

  // LAN devices – left cluster
  const lan = devices.filter(d => d.vlan === 10);
  lan.forEach((d, i) => { d.x = cx * 0.28 + i * 80; d.y = cy * 0.88; });

  // IoT – lower right
  const iot = devices.filter(d => d.vlan === 20);
  iot.forEach((d, i) => { d.x = cx * 1.55 + i * 80; d.y = cy * 0.85; });

  // Guest – upper right
  const guest = devices.filter(d => d.vlan === 30);
  guest.forEach((d, i) => { d.x = cx * 1.5 + i * 80; d.y = cy * 1.35; });

  // DMZ – left lower
  const dmz = devices.filter(d => d.vlan === 40);
  dmz.forEach((d, i) => { d.x = cx * 0.28 + i * 80; d.y = cy * 1.35; });
}

function drawTopology() {
  const w = topCvs.width, h = topCvs.height;
  topCtx.clearRect(0, 0, w, h);

  // Draw VLAN zone bubbles
  const vlanGroups = {};
  devices.forEach(d => {
    if (d.vlan !== null) {
      if (!vlanGroups[d.vlan]) vlanGroups[d.vlan] = [];
      vlanGroups[d.vlan].push(d);
    }
  });

  Object.entries(vlanGroups).forEach(([vlanId, devs]) => {
    if (devs.length === 0) return;
    const color = getVlanColor(Number(vlanId));
    const xs = devs.map(d => d.x), ys = devs.map(d => d.y);
    const minX = Math.min(...xs) - 55, maxX = Math.max(...xs) + 55;
    const minY = Math.min(...ys) - 45, maxY = Math.max(...ys) + 45;
    topCtx.beginPath();
    topCtx.roundRect(minX, minY, maxX - minX, maxY - minY, 16);
    topCtx.strokeStyle = color + '55';
    topCtx.lineWidth = 1.5;
    topCtx.stroke();
    topCtx.fillStyle = color + '10';
    topCtx.fill();

    const v = vlans.find(x => x.id === Number(vlanId));
    if (v) {
      topCtx.font = '10px Segoe UI';
      topCtx.fillStyle = color + 'bb';
      topCtx.fillText(`VLAN ${v.id} · ${v.name}`, minX + 8, minY + 14);
    }
  });

  // Draw connections
  const router = devices.find(d => d.id === 'd1');
  const sw = devices.find(d => d.id === 'd2');
  const cloud = devices.find(d => d.id === 'd11');

  // router ↔ cloud
  drawLine(topCtx, router, cloud, '#8b949e44', 1.5);
  // router ↔ switch
  drawLine(topCtx, router, sw, '#388bfd55', 2);

  // switch to all non-infra
  devices.forEach(d => {
    if (d.vlan !== null) {
      const color = getVlanColor(d.vlan);
      drawLine(topCtx, sw, d, color + '44', 1.2);
    }
  });

  // Draw nodes
  devices.forEach(d => {
    const isHovered = hoveredNode && hoveredNode.id === d.id;
    const r = isHovered ? 26 : 22;
    const color = d.vlan !== null ? getVlanColor(d.vlan) : (d.id === 'd1' ? '#388bfd' : d.id === 'd11' ? '#8b949e' : '#30363d');

    topCtx.beginPath();
    topCtx.arc(d.x, d.y, r, 0, Math.PI * 2);
    topCtx.fillStyle = '#1c2128';
    topCtx.fill();
    topCtx.strokeStyle = color;
    topCtx.lineWidth = isHovered ? 2.5 : 1.5;
    topCtx.stroke();

    topCtx.font = `${isHovered ? 18 : 16}px serif`;
    topCtx.textAlign = 'center';
    topCtx.textBaseline = 'middle';
    topCtx.fillText(d.icon, d.x, d.y);

    topCtx.font = `${isHovered ? 11 : 10}px Segoe UI`;
    topCtx.fillStyle = isHovered ? '#e6edf3' : '#8b949e';
    topCtx.textAlign = 'center';
    topCtx.textBaseline = 'top';
    topCtx.fillText(d.label, d.x, d.y + r + 4);
    topCtx.textBaseline = 'middle';
  });
}

function drawLine(ctx, a, b, color, width) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}

// ═══════════════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════════════
const MAX_PARTICLES = 120;

function computeAllowedFlows() {
  // For each VLAN-to-VLAN pair, determine if flow is allowed based on rules
  const flows = [];
  const sw = devices.find(d => d.id === 'd2');
  const router = devices.find(d => d.id === 'd1');
  const cloud = devices.find(d => d.id === 'd11');

  // Traffic between devices on different VLANs
  vlans.forEach(srcVlan => {
    vlans.forEach(dstVlan => {
      if (srcVlan.id === dstVlan.id) return;
      const allowed = isFlowAllowed(srcVlan.name, dstVlan.name);
      if (allowed !== 'block') {
        const srcDevs = devices.filter(d => d.vlan === srcVlan.id);
        const dstDevs = devices.filter(d => d.vlan === dstVlan.id);
        srcDevs.forEach(src => {
          dstDevs.forEach(dst => {
            flows.push({ src, dst, color: srcVlan.color, via: [sw, router], allowed });
          });
        });
      }
    });
  });

  // WAN traffic
  vlans.filter(v => v.type !== 'WAN').forEach(v => {
    const allowed = isFlowAllowed(v.name, 'WAN');
    if (allowed !== 'block') {
      devices.filter(d => d.vlan === v.id).forEach(src => {
        flows.push({ src, dst: cloud, color: v.color, via: [sw, router], allowed });
      });
    }
  });

  return flows;
}

function isFlowAllowed(srcZoneName, dstZoneName) {
  for (const r of rules) {
    if (!r.enabled) continue;
    const srcMatch = r.srcZone === 'Any' || r.srcZone === srcZoneName;
    const dstMatch = r.dstZone === 'Any' || r.dstZone === dstZoneName;
    if (srcMatch && dstMatch) return r.action;
  }
  return 'allow'; // default allow if no match
}

function spawnParticles() {
  if (particles.length >= MAX_PARTICLES) return;
  const flows = computeAllowedFlows();
  if (flows.length === 0) return;

  // Pick random flow
  const flow = flows[Math.floor(Math.random() * flows.length)];
  const path = [flow.src, ...flow.via, flow.dst];

  particles.push({
    path,
    pathIdx: 0,
    x: path[0].x, y: path[0].y,
    color: flow.color,
    size: Math.random() * 2.5 + 1.5,
    speed: Math.random() * 1.2 + 0.6,
    alpha: 1,
    srcVlan: vlans.find(v => v.id === flow.src.vlan)?.name || 'Unknown',
    dstVlan: vlans.find(v => v.id === flow.dst.vlan)?.name || 'Unknown',
    srcDevice: flow.src.label,
    dstDevice: flow.dst.label,
    proto: ['TCP','UDP','ICMP'][Math.floor(Math.random() * 3)],
    bytes: Math.floor(Math.random() * 9000) + 64,
  });
}

function animateParticles() {
  const w = partCvs.width, h = partCvs.height;
  partCtx.clearRect(0, 0, w, h);

  // Spawn occasionally
  if (Math.random() < 0.15) spawnParticles();

  hoveredParticle = null;

  particles.forEach((p, idx) => {
    if (p.pathIdx >= p.path.length - 1) {
      p.alpha -= 0.05;
      if (p.alpha <= 0) { particles.splice(idx, 1); return; }
    } else {
      const target = p.path[p.pathIdx + 1];
      const dx = target.x - p.x, dy = target.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < p.speed) {
        p.pathIdx++;
      } else {
        p.x += (dx / dist) * p.speed;
        p.y += (dy / dist) * p.speed;
      }
    }

    // Glow effect
    const gradient = partCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
    gradient.addColorStop(0, p.color + Math.round(p.alpha * 255).toString(16).padStart(2,'0'));
    gradient.addColorStop(1, p.color + '00');

    partCtx.beginPath();
    partCtx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
    partCtx.fillStyle = gradient;
    partCtx.fill();

    partCtx.beginPath();
    partCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    partCtx.fillStyle = p.color;
    partCtx.globalAlpha = p.alpha;
    partCtx.fill();
    partCtx.globalAlpha = 1;
  });

  animFrame = requestAnimationFrame(animateParticles);
}

// ─── Mouse events on topology ──────────────────────────────
topCvs.addEventListener('mousemove', e => {
  const rect = topCvs.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const prev = hoveredNode;
  hoveredNode = devices.find(d => {
    const dx = d.x - mx, dy = d.y - my;
    return Math.sqrt(dx * dx + dy * dy) < 28;
  }) || null;
  if (hoveredNode !== prev) drawTopology();

  if (hoveredNode) {
    showTooltipNode(e.clientX, e.clientY, hoveredNode);
  } else {
    hideTooltip();
  }
});

topCvs.addEventListener('mouseleave', () => { hoveredNode = null; drawTopology(); hideTooltip(); });

partCvs.addEventListener('mousemove', e => {
  const rect = partCvs.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const hit = particles.find(p => {
    const dx = p.x - mx, dy = p.y - my;
    return Math.sqrt(dx * dx + dy * dy) < 8;
  });
  if (hit) showTooltipParticle(e.clientX, e.clientY, hit);
  else if (!hoveredNode) hideTooltip();
});

const tooltip = document.getElementById('tooltip');

function showTooltipNode(x, y, node) {
  const vlan = vlans.find(v => v.id === node.vlan);
  let html = `<div class="tt-title">${node.icon} ${node.label}</div>`;
  html += `<div class="tt-row"><span class="tt-key">Type</span><span class="tt-val">${node.type}</span></div>`;
  if (vlan) {
    html += `<div class="tt-row"><span class="tt-key">VLAN</span><span class="tt-val" style="color:${vlan.color}">${vlan.id} · ${vlan.name}</span></div>`;
    html += `<div class="tt-row"><span class="tt-key">Subnet</span><span class="tt-val">${vlan.subnet}</span></div>`;
  }
  const activeRules = rules.filter(r => r.enabled && (r.srcZone === vlan?.name || r.dstZone === vlan?.name));
  html += `<div class="tt-row"><span class="tt-key">Active rules</span><span class="tt-val">${activeRules.length}</span></div>`;
  positionTooltip(x, y, html);
}

function showTooltipParticle(x, y, p) {
  let html = `<div class="tt-title" style="color:${p.color}">● Network Packet</div>`;
  html += `<div class="tt-row"><span class="tt-key">From</span><span class="tt-val">${p.srcDevice}</span></div>`;
  html += `<div class="tt-row"><span class="tt-key">To</span><span class="tt-val">${p.dstDevice}</span></div>`;
  html += `<div class="tt-row"><span class="tt-key">Src VLAN</span><span class="tt-val">${p.srcVlan}</span></div>`;
  html += `<div class="tt-row"><span class="tt-key">Dst VLAN</span><span class="tt-val">${p.dstVlan}</span></div>`;
  html += `<div class="tt-row"><span class="tt-key">Protocol</span><span class="tt-val">${p.proto}</span></div>`;
  html += `<div class="tt-row"><span class="tt-key">Size</span><span class="tt-val">${p.bytes} B</span></div>`;
  positionTooltip(x, y, html);
}

function positionTooltip(x, y, html) {
  tooltip.innerHTML = html;
  tooltip.classList.add('visible');
  const tw = 240, th = tooltip.offsetHeight || 120;
  let tx = x + 14, ty = y - 10;
  if (tx + tw > window.innerWidth - 10) tx = x - tw - 14;
  if (ty + th > window.innerHeight - 10) ty = y - th;
  tooltip.style.left = tx + 'px';
  tooltip.style.top = ty + 'px';
}

function hideTooltip() { tooltip.classList.remove('visible'); }

function renderVlans() {
  const el = document.getElementById('vlan-list');
  let html = `<div class="section-label">Networks</div>`;
  vlans.forEach(v => {
    const devCount = devices.filter(d => d.vlan === v.id).length;
    html += `
    <div class="vlan-item" onclick="selectVlan(${v.id})" id="vlan-item-${v.id}">
      <div class="vlan-dot" style="background:${v.color}"></div>
      <span class="vlan-name">${v.name}</span>
      <span class="vlan-badge">VLAN ${v.id}</span>
    </div>`;
  });

  html += `<div class="section-label" style="margin-top:14px">Devices</div>`;
  devices.forEach(d => {
    html += `<div class="device-chip" title="Click to highlight">${d.icon} ${d.label}</div>`;
  });

  el.innerHTML = html;

  // populate zone selects
  populateZoneSelects();
}

function selectVlan(id) {
  document.querySelectorAll('.vlan-item').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById(`vlan-item-${id}`);
  if (el) el.classList.add('selected');
}

function populateZoneSelects() {
  ['r-src-zone','r-dst-zone','p-vlan'].forEach(selId => {
    const sel = document.getElementById(selId);
    if (!sel) return;
    const prev = sel.value;
    sel.innerHTML = '<option value="Any">Any</option>' +
      vlans.map(v => `<option value="${v.name}">${v.name} (VLAN ${v.id})</option>`).join('');
    if (prev) sel.value = prev;
  });
}

function openAddVlan() { closeAllModals(); document.getElementById('modal-vlan').style.display = 'flex'; }

function saveVlan() {
  const name = document.getElementById('v-name').value.trim();
  const id = parseInt(document.getElementById('v-id').value) || (Math.max(...vlans.map(v=>v.id)) + 10);
  const subnet = document.getElementById('v-subnet').value.trim() || '192.168.0.0/24';
  const type = document.querySelector('input[name="v-type"]:checked')?.value || 'LAN';
  const color = document.getElementById('v-color').value;
  if (!name) return;
  vlans.push({ id, name, subnet, type, color });
  closeModal('modal-vlan');
  renderVlans();
  drawTopology();
}

// ═══════════════════════════════════════════════════════════
//  RULES PANEL
// ═══════════════════════════════════════════════════════════
function renderRules() {
  const el = document.getElementById('rules-list');
  document.getElementById('rule-count').textContent = rules.filter(r=>r.enabled).length;
  if (rules.length === 0) {
    el.innerHTML = `<div style="color:var(--text-muted);text-align:center;padding:20px;font-size:12px">No rules. Click ＋ Add Rule above.</div>`;
    return;
  }
  el.innerHTML = rules.map((r, i) => `
    <div class="rule-item" id="rule-${r.id}"
      draggable="true"
      ondragstart="dragStart(event,${i})"
      ondragover="dragOver(event)"
      ondrop="drop(event,${i})"
      ondragleave="dragLeave(event)"
      ondragend="dragEnd(event)">
      <div class="rule-top">
        <span class="rule-handle">⠿</span>
        <span class="rule-action ${r.action}">${r.action}</span>
        <span class="rule-name">${r.name}</span>
        <button class="rule-enabled ${r.enabled ? 'on':'off'}" onclick="toggleRule(${r.id})" title="${r.enabled?'Enabled':'Disabled'}"></button>
      </div>
      <div class="rule-detail">
        ${r.srcZone} → ${r.dstZone} · ${r.proto} · ${r.schedule}
        ${r.desc ? `<br><span style="color:var(--text-muted)">${r.desc}</span>` : ''}
      </div>
      <div class="rule-btns" style="margin-top:6px">
        <button class="rule-btn" onclick="editRule(${r.id})">✏ Edit</button>
        <button class="rule-btn" onclick="deleteRule(${r.id})" style="color:var(--danger)">🗑</button>
        ${i > 0 ? `<button class="rule-btn" onclick="moveRule(${i},-1)">↑</button>` : ''}
        ${i < rules.length-1 ? `<button class="rule-btn" onclick="moveRule(${i},1)">↓</button>` : ''}
      </div>
    </div>`).join('');
}

function toggleRule(id) {
  const r = rules.find(x => x.id === id);
  if (r) { r.enabled = !r.enabled; renderRules(); }
}

function deleteRule(id) {
  rules = rules.filter(r => r.id !== id);
  renderRules();
}

function moveRule(idx, dir) {
  const target = idx + dir;
  if (target < 0 || target >= rules.length) return;
  [rules[idx], rules[target]] = [rules[target], rules[idx]];
  renderRules();
}

function editRule(id) {
  const r = rules.find(x => x.id === id);
  if (!r) return;
  editingRuleId = id;
  document.getElementById('modal-rule-title').textContent = 'Edit Policy';
  document.getElementById('r-name').value = r.name;
  document.getElementById('r-desc').value = r.desc || '';
  setRadio('r-action', r.action);
  setRadio('r-src-type', r.srcType);
  setRadio('r-dst-type', r.dstType);
  setRadio('r-src-port', r.srcPort);
  setRadio('r-dst-port', r.dstPort);
  setRadio('r-proto', r.proto);
  setRadio('r-ipver', r.ipVer);
  setRadio('r-sched', r.schedule);
  document.getElementById('r-src-zone').value = r.srcZone;
  document.getElementById('r-dst-zone').value = r.dstZone;
  document.getElementById('modal-rule').style.display = 'flex';
}

function openAddRule() {
  editingRuleId = null;
  document.getElementById('modal-rule-title').textContent = 'Create Policy';
  document.getElementById('r-name').value = '';
  document.getElementById('r-desc').value = '';
  setRadio('r-action', 'block');
  setRadio('r-src-type', 'Any');
  setRadio('r-dst-type', 'Any');
  setRadio('r-src-port', 'Any');
  setRadio('r-dst-port', 'Any');
  setRadio('r-proto', 'All');
  setRadio('r-ipver', 'Both');
  setRadio('r-sched', 'Always');
  document.getElementById('modal-rule').style.display = 'flex';
}

function saveRule() {
  const r = {
    id: editingRuleId || Date.now(),
    name: document.getElementById('r-name').value.trim() || 'Unnamed Rule',
    action: getRadio('r-action'),
    srcZone: document.getElementById('r-src-zone').value,
    dstZone: document.getElementById('r-dst-zone').value,
    srcType: getRadio('r-src-type'),
    dstType: getRadio('r-dst-type'),
    srcPort: getRadio('r-src-port'),
    dstPort: getRadio('r-dst-port'),
    proto: getRadio('r-proto'),
    ipVer: getRadio('r-ipver'),
    schedule: getRadio('r-sched'),
    desc: document.getElementById('r-desc').value.trim(),
    enabled: true,
  };
  if (editingRuleId) {
    const idx = rules.findIndex(x => x.id === editingRuleId);
    if (idx >= 0) rules[idx] = r;
  } else {
    // Insert before last "drop all" if exists
    const lastBlock = rules.findLastIndex(r => r.name.toLowerCase().includes('drop all') || r.name.toLowerCase().includes('default'));
    if (lastBlock > 0) rules.splice(lastBlock, 0, r);
    else rules.push(r);
  }
  closeModal('modal-rule');
  renderRules();
}

// ─── Drag & Drop rules ────────────────────────────────────
function dragStart(e, idx) { dragSrcIdx = idx; e.currentTarget.classList.add('dragging'); }
function dragEnd(e) { e.currentTarget.classList.remove('dragging'); dragSrcIdx = null; document.querySelectorAll('.rule-item').forEach(el => el.classList.remove('drag-over')); }
function dragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function drop(e, idx) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (dragSrcIdx === null || dragSrcIdx === idx) return;
  const moved = rules.splice(dragSrcIdx, 1)[0];
  rules.splice(idx, 0, moved);
  renderRules();
}

// ═══════════════════════════════════════════════════════════
//  SWITCH VIEW
// ═══════════════════════════════════════════════════════════
function renderSwitchView() {
  const el = document.getElementById('view-switch');
  el.innerHTML = switches.map(sw => `
    <div class="switch-card">
      <h3>🔲 ${sw.name}</h3>
      <div class="ports-grid" id="ports-${sw.id}">
        ${sw.ports.map(p => renderPort(sw.id, p)).join('')}
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:6px">
        Click a port to configure · <span style="color:var(--accent)">■</span> Active &nbsp;
        <span style="color:var(--danger)">■</span> Blocked &nbsp;
        <span style="color:var(--warn)">■</span> Trunk
      </div>
    </div>`).join('');
}

function renderPort(swId, p) {
  const vlan = vlans.find(v => v.id === p.vlan);
  const cls = p.blocked ? 'port blocked' : p.mode === 'trunk' ? 'port trunk' : p.active ? 'port active' : 'port';
  const color = vlan ? vlan.color : '#30363d';
  return `<div class="${cls}" onclick="openPortConfig('${swId}',${p.num})"
    title="Port ${p.num} · ${vlan?.name||'Unassigned'} · ${p.mode} · ${p.speed}"
    id="port-${swId}-${p.num}">
    <div class="port-activity" style="background:${p.active && !p.blocked ? color : 'transparent'}"></div>
    <span>${p.num}</span>
  </div>`;
}

function openPortConfig(swId, portNum) {
  editingPortInfo = { swId, portNum };
  const sw = switches.find(s => s.id === swId);
  const p = sw.ports.find(x => x.num === portNum);
  document.getElementById('modal-port-title').textContent = `${sw.name} · Port ${portNum}`;
  setRadio('p-mode', p.mode === 'blocked' ? 'blocked' : p.mode);
  document.getElementById('p-vlan').value = vlans.find(v => v.id === p.vlan)?.name || '';
  setRadio('p-speed', p.speed);
  document.getElementById('modal-port').style.display = 'flex';
}

function savePort() {
  const { swId, portNum } = editingPortInfo;
  const sw = switches.find(s => s.id === swId);
  const p = sw.ports.find(x => x.num === portNum);
  const mode = getRadio('p-mode');
  p.blocked = mode === 'blocked';
  p.mode = p.blocked ? 'access' : mode;
  const vlanSel = document.getElementById('p-vlan').value;
  const v = vlans.find(x => x.name === vlanSel);
  if (v) p.vlan = v.id;
  p.speed = getRadio('p-speed');
  closeModal('modal-port');
  renderSwitchView();
}

// Port traffic simulation
function simulatePortTraffic() {
  switches.forEach(sw => {
    sw.ports.forEach(p => {
      if (!p.blocked && p.active) {
        p.traffic = Math.max(0, Math.min(1000, p.traffic + (Math.random() - 0.48) * 50));
      }
    });
  });
}

// ═══════════════════════════════════════════════════════════
//  TAB SWITCHING
// ═══════════════════════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['topology','switch'][i] === tab);
  });
  document.getElementById('view-topology').style.display = tab === 'topology' ? 'flex' : 'none';
  document.getElementById('view-switch').style.display = tab === 'switch' ? 'flex' : 'none';
  if (tab === 'switch') renderSwitchView();
  if (tab === 'topology') { resizeCanvases(); }
}

// ═══════════════════════════════════════════════════════════
//  EXPORT
// ═══════════════════════════════════════════════════════════
function exportRules() {
  const data = {
    exported: new Date().toISOString(),
    vlans: vlans.map(v => ({ id: v.id, name: v.name, subnet: v.subnet, type: v.type })),
    rules: rules.map((r, i) => ({
      order: i + 1,
      name: r.name,
      enabled: r.enabled,
      action: r.action,
      srcZone: r.srcZone,
      srcType: r.srcType,
      srcPort: r.srcPort,
      dstZone: r.dstZone,
      dstType: r.dstType,
      dstPort: r.dstPort,
      protocol: r.proto,
      ipVersion: r.ipVer,
      schedule: r.schedule,
      description: r.desc,
    })),
    switchPorts: switches.map(sw => ({
      switch: sw.name,
      ports: sw.ports.map(p => ({ port: p.num, mode: p.mode, vlan: p.vlan, speed: p.speed, blocked: p.blocked })),
    })),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'firewall-rules.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
function setRadio(name, value) {
  const el = document.querySelector(`input[name="${name}"][value="${value}"]`);
  if (el) el.checked = true;
}
function getRadio(name) {
  return document.querySelector(`input[name="${name}"]:checked`)?.value || '';
}
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function closeAllModals() { ['modal-rule','modal-vlan','modal-port'].forEach(closeModal); }
function closeModalIf(e, id) { if (e.target.id === id) closeModal(id); }

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
window.addEventListener('resize', resizeCanvases);

function init() {
  resizeCanvases();
  renderVlans();
  addDefaultRules();
  animateParticles();

  // Periodic port traffic simulation
  setInterval(() => {
    simulatePortTraffic();
    if (document.getElementById('view-switch').style.display !== 'none') renderSwitchView();
  }, 2000);

  // Periodic topology redraw (for hover state persistence)
  setInterval(() => drawTopology(), 500);
}

init();
</script>
</body>
</html>
